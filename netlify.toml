# Pitchline — Netlify (Next.js 15 App Router)
# Runtime: Netlify auto-detects Next.js / OpenNext adapter — do not pin @netlify/plugin-nextjs.
# DB: @netlify/database auto-provisions Postgres and sets NETLIFY_DB_URL at deploy.
# Prisma still uses DATABASE_URL; build exports fallback from NETLIFY_DB_URL.

[build]
  command = "export DATABASE_URL=\"${DATABASE_URL:-$NETLIFY_DB_URL}\" && npx prisma generate && npx prisma migrate deploy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
